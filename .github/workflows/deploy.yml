name: Deploy to VPS

on:
  push:
    branches:
      - main

# Lecture seule : le workflow n'a pas besoin d'écrire dans le dépôt
permissions:
  contents: read

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: deploy-production
  cancel-in-progress: false

# redis-memory-server (outil de dev local) compile Redis a l installation :
# inutile en CI (service Redis fourni) et source d echecs/lenteurs de npm ci
env:
  REDISMS_DISABLE_POSTINSTALL: "1"

jobs:
  # ============================================
  # Job 1 : Tests backend (lint + unit + audit)
  # Bloquant : un echec empeche le deploiement.
  # ============================================
  test-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: actionculture_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
          MYSQL_ROOT_PASSWORD: rootpassword
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME_TEST: actionculture_test
      DB_USER_TEST: test_user
      DB_PASSWORD_TEST: test_pass
      DB_DIALECT: mysql
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-not-used-in-prod

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Test backend
        working-directory: ./backend
        run: npm run test:ci

      - name: Audit backend (high/critical)
        working-directory: ./backend
        run: npm audit --audit-level=high --omit=dev

  # ============================================
  # Job 2 : Tests frontend (lint + unit + build + audit)
  # ============================================
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontEnd/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontEnd
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontEnd
        run: npm run lint

      - name: Test frontend
        working-directory: ./frontEnd
        run: npm test -- --run --passWithNoTests

      - name: Build frontend
        working-directory: ./frontEnd
        run: npm run build

      - name: Audit frontend (high/critical)
        working-directory: ./frontEnd
        run: npm audit --audit-level=high --omit=dev

  # ============================================
  # Job 3 : Deploiement sur VPS
  # Depend explicitement des tests : impossible de deployer sans barriere.
  # ============================================
  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Empreinte SHA256 de la clé d'hôte du VPS (anti-MITM) :
          #   ssh-keyscan -t ed25519 <host> | ssh-keygen -lf -
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            cd /home/actionCultureDZ
            # Refuser de déployer par-dessus des modifications locales du VPS
            if [ -n "$(sudo git status --porcelain --untracked-files=no)" ]; then
              echo "Modifications locales sur le VPS : deploiement annule"; sudo git status --short; exit 1
            fi
            PREV="$(sudo git rev-parse HEAD)"
            sudo git fetch --quiet origin main
            # Déployer exactement le commit testé par les jobs précédents
            sudo git merge --ff-only --quiet "$DEPLOY_SHA"
            sudo bash scripts/deploy-ci.sh "$DEPLOY_SHA" "$PREV"
