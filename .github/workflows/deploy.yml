name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # ============================================
  # Job 1 : Tests backend (lint + unit + audit)
  # Bloquant : un echec empeche le deploiement.
  # ============================================
  test-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: actionculture_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
          MYSQL_ROOT_PASSWORD: rootpassword
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME_TEST: actionculture_test
      DB_USER_TEST: test_user
      DB_PASSWORD_TEST: test_pass
      DB_DIALECT: mysql
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-not-used-in-prod

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Test backend
        working-directory: ./backend
        run: npm run test:ci

      - name: Audit backend (high/critical)
        working-directory: ./backend
        run: npm audit --audit-level=high --omit=dev

  # ============================================
  # Job 2 : Tests frontend (lint + unit + build + audit)
  # ============================================
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontEnd/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontEnd
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontEnd
        run: npm run lint

      - name: Test frontend
        working-directory: ./frontEnd
        run: npm test -- --run --passWithNoTests

      - name: Build frontend
        working-directory: ./frontEnd
        run: npm run build

      - name: Audit frontend (high/critical)
        working-directory: ./frontEnd
        run: npm audit --audit-level=high --omit=dev

  # ============================================
  # Job 3 : Deploiement sur VPS
  # Depend explicitement des tests : impossible de deployer sans barriere.
  # ============================================
  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/actionCultureDZ
            sudo git pull origin main
            sudo docker compose -f docker-compose.prod.yml stop frontend nginx
            sudo docker volume rm -f actionculturedz_frontend_build
            sudo docker compose -f docker-compose.prod.yml build --no-cache frontend backend
            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate
            sudo docker image prune -f
