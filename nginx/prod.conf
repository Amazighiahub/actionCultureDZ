# ============================================
# Nginx Production - EventCulture
# ============================================
# Reverse proxy securise : SSL + headers + rate limiting
# ============================================

# Masquer la version de nginx
server_tokens off;

# Rate limiting par adresse IP. Une adresse d'opérateur mobile (Mobilis, Djezzy, Ooredoo) regroupe
# beaucoup de visiteurs : l'accueil lance 7 appels, 8 personnes arrivant ensemble par un lien partagé
# dépassaient 30 r/s rafale 50 (429). Le contrôle fin reste dans le backend (par personne).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/s;
# 429 Too Many Requests (au lieu de 503) : le client sait qu'il doit ralentir
limit_req_status 429;

# Robots qui n'exécutent pas (ou mal) le JavaScript : réseaux sociaux, moteurs de recherche et
# assistants (Bing, sur lequel s'appuie ChatGPT, ChatGPT, Perplexity, Claude, Apple, DuckDuckGo…).
# Ils reçoivent la page de détail en HTML (route backend /api/og/...), avec le même contenu que
# le site. Google n'y est pas : il exécute le JavaScript et lit le site normal.
map $http_user_agent $is_social_bot {
    default 0;
    "~*(facebookexternalhit|facebot|whatsapp|linkedinbot|twitterbot|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|redditbot|vkshare|embedly|viber|snapchat)" 1;
    "~*(bingbot|msnbot|bingpreview|gptbot|oai-searchbot|chatgpt-user|perplexitybot|perplexity-user|claudebot|claude-user|claude-searchbot|anthropic-ai|applebot|duckduckbot|duckassistbot|yandex|baiduspider|amazonbot|petalbot|meta-externalagent|ccbot|mistralai-user)" 1;
}

# Journal d'accès sans les jetons des liens envoyés par e-mail (réinitialisation du mot de passe,
# vérification ou changement d'e-mail) : avant, ils étaient écrits en clair dans le journal
map $request_uri $uri_journal {
    "~^(?<debut>[^?]*/(?:reset-password|verify-email|verify|confirm-email-change)/)[^/?]+(?<fin>.*)$" "${debut}***${fin}";
    "~^(?<debut>[^?]*\?(?:.*&)?(?:token|t|cle)=)[^&]+(?<fin>.*)$" "${debut}***${fin}";
    default $request_uri;
}
# Page d'origine : les appels faits depuis /reset-password/<jeton> transmettent aussi ce jeton
map $http_referer $referer_journal {
    "~^(?<debut>[^?]*/(?:reset-password|verify-email|verify|confirm-email-change)/)[^/?]+(?<fin>.*)$" "${debut}***${fin}";
    "~^(?<debut>[^?]*\?(?:.*&)?(?:token|t|cle)=)[^&]+(?<fin>.*)$" "${debut}***${fin}";
    default $http_referer;
}
# rt / urt : temps total et temps du serveur d'application, en secondes (pour repérer les pages lentes)
log_format journal_masque '$remote_addr - $remote_user [$time_local] "$request_method $uri_journal $server_protocol" '
                          '$status $body_bytes_sent "$referer_journal" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

# Upstream backend
upstream backend_api {
    server backend:3001;
    keepalive 32;
}

# Upstream frontend
upstream frontend_app {
    server frontend:80;
    # Connexions réutilisées (sinon une connexion TCP interne par fichier)
    keepalive 16;
}

# ============================================
# Redirection HTTP -> HTTPS
# ============================================
server {
    listen 80;
    server_name _;

    # Certbot challenge (necessaire pour obtenir le certificat)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check (pour Docker healthcheck)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Tout le reste -> HTTPS (domaine fixe : ne pas réutiliser un Host arbitraire)
    location / {
        return 301 https://taladz.com$request_uri;
    }
}

# ============================================
# Redirection www vers non-www
server {
    listen 443 ssl;
    http2 on;
    server_name www.taladz.com;
    ssl_certificate /etc/letsencrypt/live/taladz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taladz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # HSTS aussi sur www (avant : absent, un visiteur passé par www restait exposé au HTTP)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log /var/log/nginx/access.log journal_masque;
    return 301 https://taladz.com$request_uri;
}

# ============================================
# HTTPS - Site principal (Frontend + API)
# ============================================
# Un SEUL bloc server pour `taladz.com` (+ www redirigé plus haut).
# Auparavant deux blocs 443 se chevauchaient : nginx servait le premier
# qui matchait et ignorait les directives critiques du second
# (client_max_body_size 100M, rate-limit login, /uploads, etc.).
# ============================================
server {
    listen 443 ssl;
    http2 on;
    # Un seul server_name : `www.taladz.com` est geré par le bloc de
    # redirection 443 plus haut (return 301 → taladz.com). Le declarer ici
    # declencherait `conflicting server name` côté nginx.
    server_name taladz.com;

    access_log /var/log/nginx/access.log journal_masque;

    # --- SSL ---
    ssl_certificate /etc/letsencrypt/live/taladz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taladz.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling désactivé : Let's Encrypt ne fournit pas d'URL OCSP
    # fiable pour les certificats ECDSA récents, et nginx log un warning
    # "ssl_stapling ignored, issuer certificate not found" à chaque reload.
    # Les navigateurs modernes gèrent l'OCSP côté client (Must-Staple non activé).
    # ssl_stapling on;
    # ssl_stapling_verify on;

    charset utf-8;

    # Taille max du body (uploads vidéo/image). S'applique à TOUTES les locations.
    # 10 Mo en général (classeurs à importer, contenus riches) ; 100 Mo seulement pour les envois de fichiers
    client_max_body_size 12M;

    # --- Compression Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml;

    # Bloquer les fichiers sensibles (dotfiles : .env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Fichiers uploadés servis directement par nginx via volume partagé
    # (évite de passer par Node pour les assets statiques).
    # ^~ : prioritaire sur les regex du serveur (sinon /uploads/x.jpg partait vers
    # le conteneur frontend et renvoyait 404).
    location ^~ /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        # Sans « always » : une image absente (404) n'est pas gardée 30 jours par le navigateur.
        # Un add_header ici masque ceux du serveur : HSTS et nosniff sont repris.
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Un fichier HTML/SVG déposé ici ne peut ni exécuter de script ni lire la session
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;

        # Fichiers privés : jamais servis directement (contrôle d'accès dans l'API)
        # Fichiers cachés (.htaccess, .env…) : jamais servis (le « ^~ » ci-dessus court-circuite la règle générale)
        location ~ /\. {
            deny all;
        }
        location ^~ /uploads/private/ {
            deny all;
        }
        # Bloquer l'exécution / l'affichage de contenus actifs hébergés involontairement
        location ~* \.(php|jsp|asp|sh|cgi|py|html?|xhtml|xml)$ {
            deny all;
        }
    }

    # Rate limiting strict sur l'authentification (doit être déclaré AVANT /api
    # pour que la regex match en priorité sur les prefix match).
    # « ~* » : sans tenir compte des majuscules, comme le serveur (/api/Users/Login passait à côté de la limite)
    location ~* ^/api/(users/(login|register|refresh-token|check-email)|email-verification/(request-password-reset|reset-password)) {
        limit_req zone=login_limit burst=40 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les headers de sécurité (CSP, HSTS, etc.) sont gérés par Helmet
        # côté Node. Ne pas les (re)définir ici sinon nginx masquerait ceux
        # du backend (règle : add_header dans une location annule ceux hérités).
    }

    # Médias des fiches et extraits de livre : 5 min, et une rafale large (import de catalogue,
    # images d'un article envoyées ensemble ; la limite par personne est tenue par le serveur)
    location ~ ^/api/(oeuvres/[0-9]+/(medias/upload|extrait/(pdf|audio))|artisanat/[0-9]+/medias|patrimoine/[0-9]+/medias)$ {
        limit_req zone=api_limit burst=300 nodelay;
        client_max_body_size 100M;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Uploads (toutes routes /api/upload/*) : timeouts étendus à 5 min
    location ~ ^/api/upload {
        limit_req zone=api_limit burst=10 nodelay;
        client_max_body_size 100M;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Import d'une liste d'inscriptions : un e-mail par personne, jusqu'à 500 lignes. À 60 s, nginx coupait
    # alors que le serveur continuait, et l'organisateur perdait le bilan.
    location ~ ^/api/evenements/[0-9]+/participants/import$ {
        limit_req zone=api_limit burst=300 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API Backend (général)
    location /api {
        limit_req zone=api_limit burst=300 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check direct backend
    location = /health {
        limit_req zone=api_limit burst=50 nodelay;
        access_log off;
        proxy_pass http://backend_api;
        # Sans ces en-têtes, le backend voit du HTTP et redirige vers https://backend_api/health
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemap complet (toutes les pages de détail), généré par le backend
    location = /sitemap.xml {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers générés par Vite (nom avec hash) : cache d'un an immuable.
    # (re-inclure les en-têtes de sécurité : add_header dans une location masque ceux du parent)
    location ^~ /assets/ {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Fichiers de public/ à nom fixe (images du carrousel, favicon, image de partage) : 7 jours
    location ~* ^/(?!api/|uploads/).+\.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Frontend (HTML/SPA)
    location / {
        # Une seule adresse par page : /evenements/ -> /evenements (301)
        rewrite ^/(.+)/$ https://taladz.com/$1 permanent;

        # Robots des réseaux sociaux sur une page de détail : aperçu propre à la page
        if ($is_social_bot) {
            rewrite ^/(evenements|oeuvres|patrimoine|artisanat|articles|professionnels|organisations|services|personnalites)/([0-9]+)(-[^/?]*)?$ /api/og/$1/$2 last;
        }

        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Headers de sécurité appliqués au HTML/SPA uniquement
        # (les réponses /api ont leur propre CSP stricte via Helmet)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Filtre XSS des anciens navigateurs : désactivé (source de failles), la CSP le remplace
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        # media-src : extraits audio et vidéos hébergés sur Cloudinary (sans lui, default-src 'self' les bloquait)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://res.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self' https://nominatim.openstreetmap.org; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.dailymotion.com https://w.soundcloud.com https://res.cloudinary.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }
}
