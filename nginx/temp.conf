server {
    listen 80;
    server_name echoalgerie.com www.echoalgerie.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 200 "Site en cours de configuration\n";
        add_header Content-Type text/plain;
    }
}
