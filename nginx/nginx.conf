# Configuration générale de nginx : celle de l'image, avec plus de connexions pour les pics de visites.
# Une visite passée au backend occupe deux connexions. 4 cœurs x 4096 = environ 8 000 visites simultanées.
user  nginx;
worker_processes  auto;
# Doit rester au moins le double de worker_connections, et égal aux ulimits du compose
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    # Une connexion inactive se libère plus vite qu'avec les 65 s par défaut de l'image
    keepalive_timeout  30;

    include /etc/nginx/conf.d/*.conf;
}
